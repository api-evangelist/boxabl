aid: boxabl
name: Boxabl
description: 'BOXABL Inc. is a Las Vegas, Nevada manufacturer of factory-built, foldable
  homes, founded in 2017 and trading on Nasdaq under the ticker BXBL. Its homes are
  assembled on a production line in a climate-controlled factory rather than on site,
  then folded to 8.5 by 20 feet for shipment by truck, rail, sea or air and unfolded
  on the pad in about two hours. The Casita is the current production model, sold as
  a studio, one-bedroom and two-bedroom in unit-only or turnkey configurations, with
  a Baby Box travel trailer and a multi-unit Developer Series catalog alongside it.
  BOXABL publishes no public API, developer portal or machine-readable API contract;
  its machine-readable surface is an agent-facing llms.txt, a permissive AI-crawler
  robots.txt, and an RFC 9116 security.txt pointing at a real responsible-disclosure
  and bug bounty policy.'
